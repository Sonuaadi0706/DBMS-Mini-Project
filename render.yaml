# Full ProjectPulse stack. Import as a Render Blueprint from this repository.
# Persistent disks and the database require paid Render resources.
services:
  - type: pserv
    name: projectpulse-mongo
    runtime: image
    image:
      url: docker.io/library/mongo:7
    region: singapore
    plan: 0.5c-512mb
    disk:
      name: mongo-data
      mountPath: /data/db
      sizeGB: 1
    envVars:
      - key: PORT
        value: 27017
      - key: MONGO_INITDB_ROOT_USERNAME
        value: projectpulse
      - key: MONGO_INITDB_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: projectpulse
    runtime: node
    region: singapore
    plan: 1c-2g
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate && npm run mongo:init
    startCommand: npm start
    initialDeployHook: npm run db:seed
    healthCheckPath: /login
    disk:
      name: uploads
      mountPath: /opt/render/project/src/storage/uploads
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: projectpulse-postgres
          property: connectionString
      - key: SKIP_DATABASE_CREATE
        value: 1
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: MONGODB_HOST
        fromService:
          type: pserv
          name: projectpulse-mongo
          property: host
      - key: MONGODB_USER
        value: projectpulse
      - key: MONGODB_PASSWORD
        fromService:
          type: pserv
          name: projectpulse-mongo
          envVarKey: MONGO_INITDB_ROOT_PASSWORD
      - key: MONGODB_DB
        value: projectpulse
      - key: AUTH_SECRET
        generateValue: true
      - key: JOB_SECRET
        generateValue: true
      - key: SEED_DEFAULT_PASSWORD
        sync: false
      - key: STORAGE_LOCAL_PATH
        value: /opt/render/project/src/storage/uploads

databases:
  - name: projectpulse-postgres
    databaseName: projectpulse
    region: singapore
    plan: 0.5c-1g
    postgresMajorVersion: "16"
    ipAllowList: []
